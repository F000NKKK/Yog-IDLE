# Builds Yog IDLE for Linux, Windows and macOS and attaches the packages to
# the release of the pushed tag (v1.0.0, …). Substrate-Platform and
# Yog-Mod-Loader are checked out next to it, as on a developer's machine.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release first, once: every build then uploads into it. Builds that
  # each looked for it and created their own made two releases of one tag.
  release:
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --title "Yog IDLE ${{ github.ref_name }}" --notes "Yog IDLE — the editor, launcher and debugger for Yog mods. Download the package for your system below."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      # The Yog repositories in `yog/`, Substrate's beside it: the layout the
      # IDE's `../` and `../../` paths name, as on a developer's machine.
      - uses: actions/checkout@v4
        with:
          path: yog/Yog-IDLE
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/Substrate-Platform
          path: Substrate-Platform
      # Substrate Data's TypeScript port (substrate.paths.ts).
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/Substrate-Data
          path: Substrate-Data
      # The loader's crates (yog-ids, yog-home, the debugger's) are patched in from its checkout.
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/Yog-Mod-Loader
          path: yog/Yog-Mod-Loader

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust (the toolchain rust-toolchain.toml pins)
        working-directory: yog/Yog-IDLE/src-tauri
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Substrate's UI packages
        working-directory: Substrate-Platform/ui
        run: npm ci

      - name: Yog IDLE's packages
        working-directory: yog/Yog-IDLE
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: yog/Yog-IDLE
          tagName: ${{ github.ref_name }}
          releaseName: "Yog IDLE ${{ github.ref_name }}"
          releaseBody: "Yog IDLE — the editor, launcher and debugger for Yog mods. Download the package for your system below."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
