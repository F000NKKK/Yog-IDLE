[package]
name = "yog-idle-tauri"
version = "1.0.0"
description = "Visual UI editor for Yog mods — live preview into a running Minecraft client."
authors = ["F000NK"]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yog_idle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# `yog.toml` edits from the Properties window keep the file's formatting.
toml_edit = "0.25"
# Where the Environment options and IDE-installed tools live.
dirs = "7"
substrate-platform = { path = "../../Substrate-Platform" }
tauri-plugin-window-state = "2"
# Find in Files / Code Search (`search.rs`, `symbols.rs`): a .gitignore-aware
# walk, the pattern engine, file-type masks, and the Rust symbol index
# (`span-locations` gives parsed items their line/column outside a proc macro).
ignore = "0.4.33"
regex = "1.13.1"
globset = "0.4.20"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# The screen designer draws with yog-ui itself — the crate mods render with
# in game — through a recording `YogGfxApi` (yog-abi/yog-gfx), and reads
# Minecraft's font/textures from the local client jar (zip, png).
yog-ui = "0.43.1"
yog-gfx = "0.28.1"
yog-abi = "0.30.8"
yog-book = "0.67.0"
yog-graphics = "0.1.1"
# Yog Data: the text syntax of every Yog format.
yog-data = "0.4.2"
# A dimension's terrain, previewed by the code the runtime generates it with.
yog-worldgen = "0.1.0"
# The source formats' schemas, for generated editors.
yog-formats = "0.9.0"
# The kinds of recipe (the game's, built in) the recipe editor lays out.
yog-registry = "0.35.0"
# SVG images and TrueType fonts, drawn the way the game draws them.
resvg = { version = "0.48", default-features = false }
fontdue = "0.9"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23"
# The designer host (`designer/host.rs`) loads a mod's library to draw its custom components.
libloading = "0.9"
quick-xml = "0.42"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "backend"
harness = false

# Debugger integration (Linux-only, matching yog-debugger's own scope) —
# ordinary crates.io deps, no path/git coupling to the Yog-Mod-Loader repo.
[target.'cfg(target_os = "linux")'.dependencies]
yog-symbols = "0.4.1"
yog-debugger = "0.9.1"
yog-hot-reload = "0.2.3"
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }

# The loader's crates from the sibling checkout (as Substrate-Platform is):
# the IDE always builds against the loader it ships with, published or not.
[patch.crates-io]
yog-abi = { path = "../../Yog-Mod-Loader/rust/crates/yog-abi" }
yog-api = { path = "../../Yog-Mod-Loader/rust/crates/yog-api" }
yog-body = { path = "../../Yog-Mod-Loader/rust/crates/yog-body" }
yog-book = { path = "../../Yog-Mod-Loader/rust/crates/yog-book" }
yog-cli = { path = "../../Yog-Mod-Loader/rust/crates/yog-cli" }
yog-command = { path = "../../Yog-Mod-Loader/rust/crates/yog-command" }
yog-config = { path = "../../Yog-Mod-Loader/rust/crates/yog-config" }
yog-core = { path = "../../Yog-Mod-Loader/rust/crates/yog-core" }
yog-data = { path = "../../Yog-Mod-Loader/rust/crates/yog-data" }
yog-data-derive = { path = "../../Yog-Mod-Loader/rust/crates/yog-data-derive" }
yog-debugger = { path = "../../Yog-Mod-Loader/rust/crates/yog-debugger" }
yog-dimensions = { path = "../../Yog-Mod-Loader/rust/crates/yog-dimensions" }
yog-entity = { path = "../../Yog-Mod-Loader/rust/crates/yog-entity" }
yog-event = { path = "../../Yog-Mod-Loader/rust/crates/yog-event" }
yog-font = { path = "../../Yog-Mod-Loader/rust/crates/yog-font" }
yog-formats = { path = "../../Yog-Mod-Loader/rust/crates/yog-formats" }
yog-gfx = { path = "../../Yog-Mod-Loader/rust/crates/yog-gfx" }
yog-graphics = { path = "../../Yog-Mod-Loader/rust/crates/yog-graphics" }
yog-hot-reload = { path = "../../Yog-Mod-Loader/rust/crates/yog-hot-reload" }
yog-interop = { path = "../../Yog-Mod-Loader/rust/crates/yog-interop" }
yog-inventory = { path = "../../Yog-Mod-Loader/rust/crates/yog-inventory" }
yog-kit = { path = "../../Yog-Mod-Loader/rust/crates/yog-kit" }
yog-logging = { path = "../../Yog-Mod-Loader/rust/crates/yog-logging" }
yog-network = { path = "../../Yog-Mod-Loader/rust/crates/yog-network" }
yog-player = { path = "../../Yog-Mod-Loader/rust/crates/yog-player" }
yog-registry = { path = "../../Yog-Mod-Loader/rust/crates/yog-registry" }
yog-runtime = { path = "../../Yog-Mod-Loader/rust/crates/yog-runtime" }
yog-storage = { path = "../../Yog-Mod-Loader/rust/crates/yog-storage" }
yog-symbols = { path = "../../Yog-Mod-Loader/rust/crates/yog-symbols" }
yog-ui = { path = "../../Yog-Mod-Loader/rust/crates/yog-ui" }
yog-world = { path = "../../Yog-Mod-Loader/rust/crates/yog-world" }
yog-worldgen = { path = "../../Yog-Mod-Loader/rust/crates/yog-worldgen" }
