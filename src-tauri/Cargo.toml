[package]
name = "yog-idle-tauri"
version = "0.1.0"
description = "Visual UI editor for Yog mods — live preview into a running Minecraft client."
authors = ["F000NK"]
edition = "2024"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yog_idle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
substrate-platform = { path = "../../Substrate-Platform" }

# Debugger integration (Linux-only, matching yog-debugger's own scope) —
# ordinary crates.io deps, no path/git coupling to the Yog-Mod-Loader repo.
[target.'cfg(target_os = "linux")'.dependencies]
yog-symbols = "0.1"
yog-debugger = "0.3"
yog-hot-reload = "0.2"
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }

