[package]
name = "yog-idle-tauri"
version = "0.1.0"
description = "Visual UI editor for Yog mods — live preview into a running Minecraft client."
authors = ["F000NK"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yog_idle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
substrate-platform = { path = "../../Substrate-Platform" }

# Debugger integration (Linux-only, matching yog-debugger's own scope) —
# ordinary crates.io deps, no path/git coupling to the Yog-Mod-Loader repo.
yog-symbols = "0.1"
yog-debugger = "0.3"
yog-hot-reload = "0.2"
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }

# TEMPORARY local-dev override: this pass adds `discovery`/
# `find_module_base_by_prefix`/`is_retiring`/`all_active` to yog-debugger and
# yog-hot-reload, none of which are in the crates.io 0.1.0 releases yet.
# Remove this [patch] once matching versions are published (see the sibling
# Yog-Mod-Loader/rust checkout's own release.sh) — until then this pins to
# the local checkout so Yog-IDLE actually builds against the new code.
[patch.crates-io]
yog-debugger = { path = "../../Yog-Mod-Loader/rust/crates/yog-debugger" }
yog-hot-reload = { path = "../../Yog-Mod-Loader/rust/crates/yog-hot-reload" }
yog-symbols = { path = "../../Yog-Mod-Loader/rust/crates/yog-symbols" }

