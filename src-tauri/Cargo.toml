[package]
name = "yog-idle-tauri"
version = "2.4.5"
description = "Visual UI editor for Yog mods — live preview into a running Minecraft client."
authors = ["F000NK"]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yog_idle_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
substrate-host-contract = "0.1.0"
tauri-build = { version = "2.7", features = [] }
# The front end's copy of the shared names (`src/data/yogIds.generated.ts`).
yog-ids = "0.9.0"
# The generated files' header, as TypeScript.
yog-codegen = "0.4.0"
yog-codegen-typescript = "0.4.0"

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# `yog.toml` edits from the Properties window keep the file's formatting.
toml_edit = "0.25"
# Where the Environment options and IDE-installed tools live.
dirs = "7"
substrate-lock = "0.1.0"
substrate-project-domain = "0.1.0"
substrate-project-toml = "0.1.0"
substrate-state-json = "0.1.0"
substrate-workspace-domain = "0.1.0"
substrate-workspace-fs = "0.1.0"
# Substrate's split contexts: the host contract (commands, events), searching,
# running workflows, git.
substrate-host-contract = "0.1.0"
substrate-search-app = "0.1.0"
substrate-search-domain = "0.1.0"
substrate-search-ignore = "0.1.0"
substrate-run-app = "0.1.0"
substrate-run-domain = "0.1.0"
substrate-run-process = "0.1.0"
substrate-git-gitcli = "0.1.0"
substrate-process = "0.1.0"
substrate-run-toml = "0.1.0"
# Substrate's host commands (the workspace, Source Control), as its UI calls them.
tauri-plugin-substrate = { version = "0.1.0", features = ["fs", "git", "search", "state", "terminal"] }
tauri-plugin-window-state = "2"
# Find in Files / Code Search (`search.rs`, `symbols.rs`): a .gitignore-aware
# walk, the pattern engine, file-type masks, and the Rust symbol index
# (`span-locations` gives parsed items their line/column outside a proc macro).
regex = "1.13.1"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# Generated TypeScript of Yog's ids, and the one `yog` program name.
yog-ids = "0.9.0"
# Yog's home on the machine (~/.yog): where its local patch is.
yog-home = "0.9.0"
# The running game's control channel (hot reload, the mods it runs): every platform.
yog-hot-reload = "0.9.0"
# What the CLI service (`yog serve`) and the backend say: binary Yog Data.
yog-data = "0.13.0"
# What `#[derive(Schema)]` expands to.
substrate-data = "0.4.0"
# The native debugger (Linux, Windows, macOS) and the natives' debug info.
yog-symbols = "0.12.0"
yog-debugger = "0.17.0"

[features]
# The benches' entry points into the backend (`src/bench.rs`).
bench = []

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "backend"
harness = false
required-features = ["bench"]


# The loader's crates from the sibling checkout (as Substrate-Platform is):
# the IDE always builds against the loader it ships with, published or not.
[patch.crates-io]
yog-codegen = { path = "../../Yog-Mod-Loader/rust/crates/yog-codegen" }
yog-codegen-typescript = { path = "../../Yog-Mod-Loader/rust/crates/yog-codegen-typescript" }
yog-debugger = { path = "../../Yog-Mod-Loader/rust/crates/yog-debugger" }
yog-ids = { path = "../../Yog-Mod-Loader/rust/crates/yog-ids" }
yog-home = { path = "../../Yog-Mod-Loader/rust/crates/yog-home" }
yog-data = { path = "../../Yog-Mod-Loader/rust/crates/yog-data" }
yog-hot-reload = { path = "../../Yog-Mod-Loader/rust/crates/yog-hot-reload" }
yog-symbols = { path = "../../Yog-Mod-Loader/rust/crates/yog-symbols" }
