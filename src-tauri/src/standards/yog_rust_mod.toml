# Default workflow set for the "yog-rust-mod" project standard — mirrors
# Yog-Mod-Loader's own ./build.sh commands directly. Used whenever an opened
# project of this kind has no workflow.toml of its own to override it.

[workflow.restore]
description = "Fetch dependencies (cargo + every implemented loader)"
steps = [{ run = "./build.sh", args = ["restore"] }]

[workflow.build]
description = "Compile everything (rust + every implemented loader)"
steps = [{ run = "./build.sh", args = ["build"] }]

[workflow."run-fabric-client"]
description = "Build, then run Fabric's dev client"
steps = [{ run = "./build.sh", args = ["run", "fabric", "--client"] }]

[workflow.test]
description = "Run tests (cargo test)"
steps = [{ run = "./build.sh", args = ["test"] }]

[workflow.clean]
description = "Remove build outputs and artifacts"
steps = [{ run = "./build.sh", args = ["clean"] }]

[workflow."publish-fabric"]
description = "Release build + assemble artifacts/fabric/"
steps = [{ run = "./build.sh", args = ["publish", "fabric"] }]
