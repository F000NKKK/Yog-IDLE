[package]
name = "yog-idle"
version = "0.1.0"
edition = "2024"
authors = ["F000NK"]
description = "Visual UI editor for Yog mods — live preview into a running Minecraft client. Built on Substrate Platform."
license = "AGPL-3.0-only"
